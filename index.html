<!DOCTYPE html>
<html>
<head>
  <title>MyFit Routine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family:-apple-system; margin:0; background:#f4f7f6; }
    header { background:#7FB3A8; color:white; padding:18px; text-align:center; }
    section { padding:14px; }
    .card { background:white; border-radius:14px; padding:15px; margin-bottom:12px; }
    h3 { margin-top:0; }
    label { display:flex; align-items:center; font-size:17px; margin:8px 0; }
    input[type=checkbox] { transform:scale(1.3); margin-right:10px; }
    button { background:#FF6F61; color:white; border:none; padding:10px 14px; border-radius:10px; margin-top:8px; }
    input { padding:8px; width:100%; margin-top:6px; }
  </style>
</head>

<body>
<header>
  <h2>MyFit Routine</h2>
  <p>72 kg → 65 kg</p>
</header>

<section>

<!-- DAILY CHECKLIST -->
<div class="card">
<h3>Daily Diet Checklist</h3>

<label><input type="checkbox" id="water">Warm Water</label>
<label><input type="checkbox" id="breakfast">Breakfast (300 kcal)</label>
<label><input type="checkbox" id="fruit">Fruit</label>
<label><input type="checkbox" id="lunch">Lunch (400 kcal)</label>
<label><input type="checkbox" id="snack">Evening Snack</label>
<label><input type="checkbox" id="dinner">Dinner (Soup)</label>

<button onclick="resetDay()">Reset Day</button>
</div>

<!-- PORTIONS -->
<div class="card">
<h3>Portion Guide</h3>
<p><b>Breakfast:</b> 1 cup poha / 2 chilla / 2 eggs</p>
<p><b>Lunch:</b> 1 roti OR ½ cup rice + 1 cup dal/chicken</p>
<p><b>Dinner:</b> 1 bowl soup + ½ cup protein</p>
</div>

<!-- WEIGHT TRACKER -->
<div class="card">
<h3>Weekly Weight Tracker</h3>
<input type="number" id="weight" placeholder="Enter weight (kg)">
<button onclick="addWeight()">Save Weight</button>
<canvas id="chart" height="200"></canvas>
</div>

</section>

<script>
/* ---------- CHECKLIST STORAGE ---------- */
const items = ["water","breakfast","fruit","lunch","snack","dinner"];

items.forEach(id => {
  const checkbox = document.getElementById(id);
  checkbox.checked = localStorage.getItem(id) === "true";
  checkbox.addEventListener("change", () => {
    localStorage.setItem(id, checkbox.checked);
  });
});

function resetDay() {
  items.forEach(id => {
    localStorage.removeItem(id);
    document.getElementById(id).checked = false;
  });
}

/* ---------- WEIGHT TRACKER ---------- */
let weights = JSON.parse(localStorage.getItem("weights")) || [];

function addWeight() {
  const w = document.getElementById("weight").value;
  if (w) {
    weights.push(w);
    localStorage.setItem("weights", JSON.stringify(weights));
    document.getElementById("weight").value = "";
    drawChart();
  }
}

function drawChart() {
  new Chart(document.getElementById("chart"), {
    type: 'line',
    data: {
      labels: weights.map((_, i) => "Week " + (i + 1)),
      datasets: [{
        label: "Weight (kg)",
        data: weights,
        borderColor: "#7FB3A8",
        fill: false
      }]
    }
  });
}
drawChart();
</script>

</body>
</html>
